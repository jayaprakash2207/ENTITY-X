name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python test dependencies (no ML models)
        run: pip install -r backend/requirements-ci.txt

      - name: Run Python tests
        run: python -m pytest backend/tests/ -q --tb=short --ignore=backend/tests/test_face_recognizer.py --ignore=backend/tests/test_person_registry.py

      - name: Install full Python dependencies for build
        run: pip install -r backend/requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build frontend
        run: npm run build

      - name: Bundle Python backend (PyInstaller)
        run: python -m PyInstaller backend.spec

      - name: Build Electron installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: entity-x-windows-installer
          path: release/*.exe
          retention-days: 30

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build frontend
        run: npm run build

      - name: Bundle Python backend
        run: python -m PyInstaller backend.spec

      - name: Build Electron installer
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

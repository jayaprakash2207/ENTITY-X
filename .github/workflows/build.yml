name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write .env with API keys
        shell: bash
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "HF_API_KEY=${{ secrets.HF_API_KEY }}" >> .env
          echo "ENTITY_X_CLOUD_URL=https://entity-x.onrender.com" >> .env
          echo "NODE_ENV=production" >> .env
          echo "BACKEND_PORT=8000" >> .env

      - name: Install Node dependencies
        run: npm install

      - name: Install Python test dependencies
        run: pip install -r backend/requirements-ci.txt

      - name: Run Python tests
        run: python -m pytest backend/tests/ -q --tb=short --ignore=backend/tests/test_face_recognizer.py --ignore=backend/tests/test_person_registry.py

      - name: Install PyInstaller + backend dependencies (no ML models)
        run: pip install pyinstaller -r backend/requirements-ci.txt

      - name: Bundle Python backend with PyInstaller
        run: python -m PyInstaller backend.spec

      - name: Build frontend
        run: npm run build

      - name: Build Electron installer (includes bundled backend)
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: entity-x-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: entity-x-windows-installer
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
